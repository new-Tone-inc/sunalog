<!doctype html>
<!-- セールの特設ページ（blackfriday/）の共有用画像（1200x630）の元。作り方は README「セールの特設ページ」の「共有」 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #f5f5f5; color: #3f4a52;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  .fig { position: absolute; left: -44px; top: -42px; width: 675px; height: 675px; }
  .txt { position: absolute; left: 540px; top: 104px; right: 40px; }
  .tags { display: flex; gap: 12px; align-items: center; }
  .tag { display: inline-block; font-size: 26px; font-weight: 700; line-height: 1; padding: 11px 18px; border-radius: 8px; letter-spacing: .04em; }
  .tag-red { background: #e94b25; color: #fff; }
  .tag-line { border: 3px solid #3f4a52; padding: 8px 16px; }
  h1 { margin: 30px 0 0; font-size: 66px; font-weight: 800; line-height: 1.22; letter-spacing: 0; white-space: nowrap; }
  h1 small { display: block; font-size: 50px; font-weight: 700; letter-spacing: .02em; }
  .bar { width: 120px; height: 12px; border-radius: 6px; background: #e94b25; margin: 30px 0 26px; }
  .lead { margin: 0; font-size: 31px; font-weight: 600; line-height: 1.5; }
  .site { margin: 20px 0 0; font-size: 25px; color: #a7a7a7; font-weight: 500; }
</style>
</head>
<body>
  <img class="fig" src="../assets/brand/sunalog-character.jpg" alt="">
  <div class="txt">
    <div class="tags"><span class="tag tag-red">SALE</span><span class="tag tag-line">2026.11.27〜12.7</span></div>
    <h1><small>Amazon</small>ブラックフライデー</h1>
    <div class="bar"></div>
    <p class="lead">動画で紹介したアイテムの<br>セール対象まとめ</p>
    <p class="site">すなおのガジェログ｜sunalog.newtone-inc.jp</p>
  </div>
</body>
</html>
