<!doctype html><meta charset="utf-8"><body><pre id="o">saving...</pre><script>
(async()=>{try{const b64=location.hash.slice(1);const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const txt=new TextDecoder().decode(bytes);const r=await fetch('/save',{method:'POST',body:txt});document.getElementById('o').textContent='saved '+txt.length+' chars: '+await r.text();}catch(e){document.getElementById('o').textContent='error '+e;}})();
</script></body>
